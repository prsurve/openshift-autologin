name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Verify version matches manifest
        run: |
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          TAG_VERSION="${{ steps.get_version.outputs.version }}"

          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "manifest.json: $MANIFEST_VERSION"
            echo "Git tag: $TAG_VERSION"
            exit 1
          fi

          echo "✅ Version matches: $MANIFEST_VERSION"

      - name: Create release package
        run: |
          mkdir -p release

          # Create distribution zip
          zip -r release/openshift-autologin-v${{ steps.get_version.outputs.version }}.zip \
            manifest.json \
            popup.html \
            popup.js \
            content.js \
            background.js \
            icon*.png \
            README.md \
            -x "*.git*" "node_modules/*" "dist/*" ".claude/*"

          # Show package contents
          echo "📦 Package contents:"
          unzip -l release/openshift-autologin-v${{ steps.get_version.outputs.version }}.zip

      - name: Generate changelog
        id: changelog
        run: |
          # Extract version section from README
          VERSION="${{ steps.get_version.outputs.version }}"

          # Create a basic changelog from recent commits
          echo "## Changes in v${VERSION}" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          # Get commits since last tag
          PREV_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "### Commits since $PREV_TAG" >> CHANGELOG.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "### Recent commits" >> CHANGELOG.md
            git log -10 --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Release summary
        run: |
          echo "## 🚀 Release v${{ steps.get_version.outputs.version }} Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Package: openshift-autologin-v${{ steps.get_version.outputs.version }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release is ready for distribution" >> $GITHUB_STEP_SUMMARY
